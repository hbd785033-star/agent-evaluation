[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evaluation"
version = "0.2.0"
description = "Run-record based evaluation platform for real agent harnesses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.12"]
deepeval = ["deepeval==2.7.6"]

[project.scripts]
agent-eval = "agent_eval.cli:main"

[tool.setuptools.packages.find]
include = ["agent_eval*", "evaluators*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
