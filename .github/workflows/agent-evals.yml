name: Agent Evaluation Framework CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  framework-and-runner-smoke:
    name: Framework unit tests + real subprocess runner smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check agent_eval evaluators tests/test_runner.py
      - name: Run framework tests without public-network probes
        run: |
          mkdir -p reports
          python -m pytest tests/ -v \
            -m "not regression" \
            -k "not github_url_reachable and not phantom_url_not_reachable" \
            --tb=short \
            --junitxml=reports/framework.xml
      - name: Upload framework results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-results
          path: reports/framework.xml

  regression-dataset:
    name: Regression dataset + runner contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run actual marked regression tests
        run: |
          mkdir -p reports
          python -m pytest tests/test_runner.py -v -m regression \
            --tb=long \
            --junitxml=reports/regression.xml
      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: reports/regression.xml
